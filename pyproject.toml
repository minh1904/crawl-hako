[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lnget"
version = "2.0.0"
description = "Tải light novel từ Hako (docln.sbs) và các site khác ra EPUB / DOCX / PDF / ảnh — CLI, menu terminal và Web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ebooklib>=0.18",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "rich>=13.0",
    "questionary>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
lnget = "lnget.cli:main"

[tool.setuptools.packages.find]
include = ["lnget*"]

[tool.setuptools.package-data]
lnget = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
